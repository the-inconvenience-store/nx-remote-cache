[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
hadolint = "2.15.1"
cocogitto = "7.0.0"
actionlint = "1.7.12"
helm = "4.3.1"
typos = "1.51.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"

[tasks.bootstrap]
description = "Install pinned tools, Go modules, and git hooks"
run = ["mise install", "go mod download", "lefthook install"]

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.fmt-check]
description = "Fail if Go code is not formatted"
run = "golangci-lint fmt --diff"

[tasks.lint]
description = "Run all linters"
run = [
  "golangci-lint run",
  "hadolint Dockerfile",
  "actionlint",
  "typos",
  "helm lint charts/nx-remote-cache --set secrets.nxCacheAccessToken=lint --set config.s3.endpointUrl=http://localhost:3900",
]

[tasks.test]
description = "Unit tests (no Docker)"
run = "go test -race ./..."

[tasks.test-integration]
description = "Integration tests against Garage via testcontainers (needs Docker)"
run = 'DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format "{% raw %}{{.Endpoints.docker.Host}}{% endraw %}")}" go test -race -tags integration -count=1 ./internal/...'

[tasks.e2e]
description = "Real Nx 23.3 builds against the server and Garage (needs Docker and Node)"
run = 'DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format "{% raw %}{{.Endpoints.docker.Host}}{% endraw %}")}" go test -tags e2e -count=1 -timeout 20m ./e2e/...'

[tasks.test-s3]
description = "Optional atomic-write contract against a real S3 bucket (configure AWS_* and S3_* env)"
run = "go test -tags s3contract -count=1 -run TestS3Contract ./internal/server/..."

[tasks.audit]
description = "Check dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.deadcode]
description = "Report functions unreachable from main"
run = "test -z \"$(deadcode -test ./...)\" || { deadcode -test ./...; exit 1; }"

[tasks.check]
description = "Complete local gate"
depends = ["fmt-check", "lint", "test", "audit", "deadcode"]

[tasks.dev]
description = "Run Garage via compose and the server against it"
run = ["docker compose up -d --wait", "go run ./cmd/nx-remote-cache"]
env = { _.file = ".env.local" }

[tasks.docker]
description = "Build the container image"
run = "docker build -t nx-remote-cache:dev ."
