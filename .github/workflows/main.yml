name: Lint, Test and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: Format check, lint, unit tests, audit, dead code
        run: mise run check

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: Integration tests against Garage
        run: mise run test-integration

  e2e:
    name: Nx E2E (${{ matrix.nx-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nx-version: ["23.3.0", "24.0.2"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - name: Nx builds against the cache server
        env:
          NX_VERSION: ${{ matrix.nx-version }}
        run: mise run e2e
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: cog check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: mise exec -- cog check "${BASE_SHA}..${HEAD_SHA}"

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: helm lint
        run: >-
          mise exec -- helm lint charts/nx-remote-cache
          --set secrets.nxCacheAccessToken=lint
          --set config.s3.endpointUrl=http://localhost:3900
      - name: helm template smoke test (static keys, read-only token)
        run: |
          mise exec -- helm template test charts/nx-remote-cache \
            --set secrets.nxCacheAccessToken=token \
            --set secrets.nxCacheReadOnlyToken=read-only-token \
            --set secrets.awsAccessKeyId=key \
            --set secrets.awsSecretAccessKey=secret \
            --set config.s3.endpointUrl=http://localhost:3900 \
            > /dev/null
      - name: helm template smoke test (ambient AWS credentials)
        run: |
          mise exec -- helm template test charts/nx-remote-cache \
            --set secrets.nxCacheAccessToken=token \
            > /dev/null

  publish:
    name: Publish Image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - check
      - integration
      - e2e
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: the-inconvenience-store/nx-remote-cache
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: |
            linux/amd64
            linux/arm64/v8

  helm-publish:
    name: Publish Helm Chart
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - check
      - integration
      - e2e
      - helm
      - publish
    permissions:
      contents: read
      packages: write
    env:
      CHART_DIR: charts/nx-remote-cache
      CHART_REPO: oci://ghcr.io/the-inconvenience-store/charts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Derive version from release tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Package chart
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: mise exec -- helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION"
      - name: Login to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | mise exec -- helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Push chart to GHCR
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: mise exec -- helm push "nx-remote-cache-${VERSION}.tgz" "$CHART_REPO"
