apiVersion: v1
kind: Service
metadata:
  name: {{ include "nx-remote-cache.fullname" . }}
  labels:
    {{- include "nx-remote-cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.serviceMonitor.enabled }}
    - port: {{ .Values.config.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "nx-remote-cache.selectorLabels" . | nindent 4 }}
