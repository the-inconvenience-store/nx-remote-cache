apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nx-remote-cache.fullname" . }}
  labels:
    {{- include "nx-remote-cache.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nx-remote-cache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nx-remote-cache.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nx-remote-cache.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
            {{- if ne (int .Values.config.metricsPort) 0 }}
            - name: metrics
              containerPort: {{ .Values.config.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: METRICS_PORT
              value: {{ .Values.config.metricsPort | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.config.s3.bucketName | quote }}
            {{- with .Values.config.s3.endpointUrl }}
            - name: S3_ENDPOINT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.s3.forcePathStyle) "" }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.config.s3.forcePathStyle | toString | quote }}
            {{- end }}
            - name: NX_CACHE_FAIL_OPEN
              value: {{ .Values.config.failOpen | quote }}
            {{- $maxArtifactBytes := .Values.config.maxArtifactBytes }}
            {{- if not (kindIs "invalid" $maxArtifactBytes) }}
            {{- /* A values-file number is a float64: render a whole one without exponent
                 form and pass anything else on unchanged, so the server rejects it. */}}
            {{- if and (kindIs "float64" $maxArtifactBytes) (eq $maxArtifactBytes (float64 (int64 $maxArtifactBytes))) }}
            {{- $maxArtifactBytes = int64 $maxArtifactBytes }}
            {{- end }}
            - name: NX_CACHE_MAX_ARTIFACT_BYTES
              value: {{ $maxArtifactBytes | toString | quote }}
            {{- end }}
            - name: NX_CACHE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nx-remote-cache.secretName" . }}
                  key: nx-cache-access-token
            - name: NX_CACHE_READ_ONLY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nx-remote-cache.secretName" . }}
                  key: nx-cache-read-only-token
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nx-remote-cache.secretName" . }}
                  key: aws-access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nx-remote-cache.secretName" . }}
                  key: aws-secret-access-key
                  optional: true
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_PATH
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.certKey | quote }}
            - name: TLS_KEY_PATH
              value: {{ printf "%s/%s" .Values.tls.mountPath .Values.tls.keyKey | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.tls.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "tls.secretName is required when tls.enabled is true" .Values.tls.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
