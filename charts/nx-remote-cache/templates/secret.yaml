{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nx-remote-cache.fullname" . }}
  labels:
    {{- include "nx-remote-cache.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.tokenExchange.providers }}
  {{- with .Values.secrets.nxCacheAccessToken }}
  nx-cache-access-token: {{ . | quote }}
  {{- end }}
  nx-cache-issued-token-keys: {{ required "secrets.issuedTokenKeys is required when token exchange is on and secrets.existingSecret is not set" .Values.secrets.issuedTokenKeys | quote }}
  {{- with .Values.secrets.githubReadOnlyTokens }}
  nx-cache-github-read-only-tokens: {{ . | quote }}
  {{- end }}
  {{- else }}
  nx-cache-access-token: {{ required "secrets.nxCacheAccessToken is required when secrets.existingSecret is not set" .Values.secrets.nxCacheAccessToken | quote }}
  {{- end }}
  {{- with .Values.secrets.nxCacheReadOnlyToken }}
  nx-cache-read-only-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsAccessKeyId }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
{{- end }}
