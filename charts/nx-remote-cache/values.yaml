image:
  repository: ghcr.io/the-inconvenience-store/nx-remote-cache
  # Defaults to .Chart.AppVersion if empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: false

# Set these when the cluster enforces a restricted pod security standard:
# podSecurityContext:
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
# securityContext:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: true
#   capabilities:
#     drop:
#       - ALL
podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: true
  name: ""
  # Annotations to add to the ServiceAccount. Use this for IRSA
  # (eks.amazonaws.com/role-arn) or GKE Workload Identity
  # (iam.gke.io/gcp-service-account) to avoid static AWS keys.
  annotations: {}

probes:
  liveness:
    enabled: true
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  # /ready checks bucket access (2s internal timeout); unready pods leave the
  # Service without being restarted. Liveness stays on /health.
  readiness:
    enabled: true
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 3

# Non-secret configuration mapped to env vars in the container.
config:
  port: 3000
  # Port for Prometheus /metrics (METRICS_PORT), plain HTTP without auth and
  # not exposed by the Service. 0 turns metrics off.
  metricsPort: 9090
  # When storage fails, degrade to a cache miss (GET 404) or non-fatal
  # "not stored" (PUT 403) so Nx keeps building. Set false to return 503
  # and fail the Nx run instead.
  failOpen: true
  # Largest upload Content-Length in bytes (NX_CACHE_MAX_ARTIFACT_BYTES). A
  # larger upload gets 403 and is not stored; Nx continues. 0 means no limit.
  maxArtifactBytes: 0
  # Stop an artifact transfer when none of its bytes move for this long
  # (NX_CACHE_STALL_TIMEOUT), a Go duration greater than zero. There is no
  # limit on the total transfer time.
  stallTimeout: 60s
  awsRegion: us-east-1
  s3:
    bucketName: nx-cloud
    # Optional S3 endpoint URL for S3-compatible storage. Leave empty for AWS S3.
    endpointUrl: ""
    # Optional "true" (path-style) or "false" (virtual-hosted style). Empty
    # keeps the default: virtual-hosted on AWS S3, path-style with endpointUrl.
    forcePathStyle: ""

# Secret strategy: either supply the values below to have the chart create a
# Secret, or set existingSecret to the name of an externally managed Secret.
# Secret keys:
#   - nx-cache-access-token     (required)
#   - nx-cache-read-only-token  (optional)
#   - aws-access-key-id         (optional; omit both AWS keys to use the AWS
#   - aws-secret-access-key      default credential chain, e.g. IRSA)
# Empty optional values are omitted from the chart-created Secret.
secrets:
  existingSecret: ""
  # Comma-separated list; list old and new tokens together to rotate them.
  nxCacheAccessToken: ""
  # Optional comma-separated list; no token may also be an access token.
  nxCacheReadOnlyToken: ""
  # Optional; set both or neither.
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

# Optional TLS/HTTPS. When enabled the server reads the cert/key from a mounted
# Secret and serves HTTPS instead of HTTP. Disabled by default — TLS is commonly
# terminated at the Ingress instead.
tls:
  enabled: false
  # Name of an existing Secret (e.g. a kubernetes.io/tls Secret managed by
  # cert-manager) holding the PEM cert and key. Required when enabled.
  secretName: ""
  # Keys within the Secret holding the PEM cert and key.
  certKey: tls.crt
  keyKey: tls.key
  # Mount path for the cert/key inside the container.
  mountPath: /etc/nx-remote-cache/tls

# Extra environment variables appended to the container. Use either `value`
# or `valueFrom` per Kubernetes env semantics.
extraEnv: []
